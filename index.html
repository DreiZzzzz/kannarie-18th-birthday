<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050504">
    <meta name="description" content="You are invited to celebrate Kannarie's 18th birthday on December 12, 2026.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kannarie's 18th Birthday">
    <meta property="og:description" content="Join us for an elegant celebration on December 12, 2026.">
    <meta property="og:image" content="assets/photos/1_option.jpeg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kannarie's 18th Birthday">
    <meta name="twitter:description" content="Join us for an elegant celebration on December 12, 2026.">
    <meta name="twitter:image" content="assets/photos/1_option.jpeg">
    <title>Kannarie's 18th Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <a class="skip-link" href="#invitation">Skip to invitation</a>

    <nav class="page-dots" aria-label="Invitation pages">
      <a class="dot active" href="#invitation" aria-label="Invitation" aria-current="page"></a>
      <a class="dot" href="#roses-candles" aria-label="Roses and candles"></a>
      <a class="dot" href="#bills-shots" aria-label="Blue bills and shots"></a>
      <a class="dot" href="#dress-code" aria-label="Dress code"></a>
    </nav>

    <main class="pages">
      <section class="page page--hero" id="invitation" data-page="0">
        <img class="photo photo--one" src="assets/photos/1_option.jpeg" alt="Kannarie seated beside flowers in a blush gown">
        <div class="photo-shade"></div>
        <div class="hero-content reveal">
          <p class="eyebrow" id="invite-line"></p>
          <h1 id="celebrant-name"></h1>
          <div class="ornament" aria-hidden="true"><span>✦</span></div>
          <div class="event-line"><span id="event-date"></span><i></i><span id="event-time"></span></div>
          <p class="arrival-note" id="arrival-note"></p>
          <div class="venue-block">
            <p class="mini-label">The celebration will be held at</p>
            <p class="venue" id="venue-name"></p>
            <p class="venue-address" id="venue-address"></p>
            <a class="location-link" id="location-link" target="_blank" rel="noopener noreferrer">View Location <span aria-hidden="true">↗</span></a>
          </div>
          <div class="countdown" aria-label="Countdown to the celebration" aria-live="off">
            <div><strong id="days">—</strong><span>Days</span></div>
            <div><strong id="hours">—</strong><span>Hours</span></div>
            <div><strong id="minutes">—</strong><span>Mins</span></div>
            <div><strong id="seconds">—</strong><span>Secs</span></div>
          </div>
          <p class="reservation" id="reservation"></p>
        </div>
        <a class="scroll-cue" href="#roses-candles" aria-label="Scroll to the next page"><span></span></a>
      </section>

      <section class="page page--program page--second" id="roses-candles" data-page="1">
        <img class="photo photo--two" src="assets/photos/6_option.jpeg" alt="Close portrait of Kannarie in a lavender gown" loading="lazy">
        <div class="photo-shade photo-shade--strong"></div>
        <div class="program-card reveal">
          <p class="eyebrow">A cherished tradition</p>
          <h2>Celebration Program</h2>
          <div class="tabs" role="tablist" aria-label="Roses and candles lists">
            <button class="tab active" type="button" role="tab" aria-selected="true" aria-controls="roses-panel" id="roses-tab">18 Roses</button>
            <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="candles-panel" id="candles-tab">18 Candles</button>
          </div>
          <div class="list-panel active" id="roses-panel" role="tabpanel" aria-labelledby="roses-tab" tabindex="0"><ol id="roses-list"></ol></div>
          <div class="list-panel" id="candles-panel" role="tabpanel" aria-labelledby="candles-tab" tabindex="0" hidden><ol id="candles-list"></ol></div>
        </div>
      </section>

      <section class="page page--program page--third" id="bills-shots" data-page="2">
        <img class="photo photo--three" src="assets/photos/13_option.jpeg" alt="Kannarie holding a lantern beside white flowers" loading="lazy">
        <div class="photo-shade photo-shade--strong"></div>
        <div class="program-card reveal">
          <p class="eyebrow">An evening to remember</p>
          <h2>Celebration Program</h2>
          <div class="tabs" role="tablist" aria-label="Blue bills and shots lists">
            <button class="tab active" type="button" role="tab" aria-selected="true" aria-controls="bills-panel" id="bills-tab">18 Blue Bills</button>
            <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="shots-panel" id="shots-tab">18 Shots</button>
          </div>
          <div class="list-panel active" id="bills-panel" role="tabpanel" aria-labelledby="bills-tab" tabindex="0"><ol id="bills-list"></ol></div>
          <div class="list-panel" id="shots-panel" role="tabpanel" aria-labelledby="shots-tab" tabindex="0" hidden><ol id="shots-list"></ol></div>
        </div>
      </section>

      <section class="page page--dress" id="dress-code" data-page="3">
        <div class="gold-haze" aria-hidden="true"></div>
        <div class="dress-content reveal">
          <p class="eyebrow">The evening's palette</p>
          <h2 id="dress-heading"></h2>
          <div class="dress-swatch" aria-hidden="true"><span></span></div>
          <h3 id="dress-color"></h3>
          <p id="dress-note"></p>
          <div class="attire" id="attire-gallery" hidden>
            <div class="attire-group">
              <p>For Ladies</p>
              <div class="attire-grid">
                <img src="assets/attire/women1.jpg" alt="Formal black dress inspiration" loading="lazy">
                <img src="assets/attire/women2.jpg" alt="Elegant black evening dress inspiration" loading="lazy">
              </div>
            </div>
            <div class="attire-group">
              <p>For Gentlemen</p>
              <div class="attire-grid">
                <img src="assets/attire/men1.jpg" alt="Formal black suit inspiration" loading="lazy">
                <img src="assets/attire/men2.jpg" alt="Black evening tuxedo inspiration" loading="lazy">
              </div>
            </div>
          </div>
          <div class="closing-ornament" aria-hidden="true">✦</div>
          <p class="closing" id="closing-line"></p>
          <p class="signature" id="signature-name"></p>
        </div>
      </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
